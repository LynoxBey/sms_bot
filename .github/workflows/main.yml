name: SMS Bot v4 - Sifir Key

on:
  schedule:
    # Sabah: UTC 04:00 = TR 07:00 (Hava + Motivasyon)
    - cron: '0 4 * * *'
    # Aksam: UTC 17:00 = TR 20:00 (Ingilizce/Teknoloji + Mac varsa skor)
    - cron: '0 17 * * *'

  # Manuel test butonu
  workflow_dispatch:

jobs:
  sms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: sent_cache.json
          key: sms-v4-${{ github.run_number }}
          restore-keys: sms-v4-

      - name: SMS Gonder
        env:
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          MY_PHONE: ${{ secrets.MY_PHONE }}
          SEHIR: ${{ secrets.SEHIR }}
        run: python sms_bot.py

      - name: Cache Kaydet
        if: always()
        run: |
          if [ -f sent_cache.json ]; then
            git config user.name "Bot"
            git config user.email "bot@x"
            git add sent_cache.json
            git diff --cached --quiet || git commit -m "cache"
            git push || true
          fi
